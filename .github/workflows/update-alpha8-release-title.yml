name: Update alpha.8 release title once
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/update-alpha8-release-title.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply release title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v0.2.1-alpha.8 --repo "$GITHUB_REPOSITORY" --title 'DSH Codex Native alpha.8 — Stability, Token Accuracy & Native Context Management'
