name: Refresh alpha.8 Release description once
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-alpha8-release-copy.yml']
permissions:
  contents: write
jobs:
  update-release-description:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize alpha.8 release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v0.2.1-alpha.8 --repo "$GITHUB_REPOSITORY" --notes-file docs/releases/alpha.8/notes.md
          echo 'RELEASE_DESCRIPTION_UPDATED'
