name: Publish install-ready Codex native alpha
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dsh-codex-native-publish-alpha-1
  cancel-in-progress: false
jobs:
  publish-preview:
    name: Build, Git-install-smoke, and publish alpha.1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install source dependencies only in hosted runner
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Check package identity and no Git install lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import p from './package.json' with { type: 'json' }
          if (p.name !== 'dsh-codex-native' || p.version !== '0.2.1-alpha.1') throw new Error('Wrong preview identity')
          for (const name of ['prepare', 'prepack', 'postinstall', 'install', 'preinstall']) {
            if (p.scripts?.[name]) throw new Error('Git installer must not run ' + name)
          }
          NODE
      - name: Typecheck DSH 0.2.1 adapter
        run: pnpm run typecheck
      - name: Run account-free unit tests
        run: pnpm run test:ci
      - name: Build production output in cloud runner
        run: pnpm run build
      - name: Pack .tgz and check both installer entries
        shell: bash
        run: |
          set -euo pipefail
          test -s lib/index.js
          test -s lib/client.js
          test -s lib/client/index.d.ts
          mkdir -p dist
          pnpm pack --pack-destination dist
          TGZ='dist/dsh-codex-native-0.2.1-alpha.1.tgz'
          test -s "$TGZ"
          tar -tzf "$TGZ" > "$RUNNER_TEMP/pack-file-list.txt"
          grep -Fxq 'package/lib/index.js' "$RUNNER_TEMP/pack-file-list.txt"
          grep -Fxq 'package/lib/client.js' "$RUNNER_TEMP/pack-file-list.txt"
          grep -Fxq 'package/lib/client/index.d.ts' "$RUNNER_TEMP/pack-file-list.txt"
      - name: Create precompiled immutable test ref (not a second development branch)
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.2.1-alpha.1'
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null; then
            echo 'Preview tag exists: refusing to overwrite immutable version'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # pnpm may update imported lockfile in the disposable workspace; only commit compiled artifacts.
          git restore --worktree -- pnpm-lock.yaml || true
          git add -f lib
          git diff --cached --quiet && { echo 'No compiled output staged'; exit 1; }
          git commit -m 'build(release): include compiled DSH Codex plugin without install hooks'
          BUILD_SHA="$(git rev-parse HEAD)"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
      - name: Test exact GitHub-tag install without allowBuilds override
        shell: bash
        run: |
          set -euo pipefail
          CONSUMER="$RUNNER_TEMP/dsh-consumer"
          mkdir -p "$CONSUMER"
          cd "$CONSUMER"
          printf '{"name":"dsh-codex-git-install-test","version":"1.0.0","private":true}\n' > package.json
          printf 'packages:\n  - .\nautoInstallPeers: false\n' > pnpm-workspace.yaml
          pnpm add 'github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.1'
          test -s node_modules/dsh-codex-native/lib/index.js
          test -s node_modules/dsh-codex-native/lib/client.js
          node --input-type=module <<'NODE'
          import p from './node_modules/dsh-codex-native/package.json' with { type: 'json' }
          if (p.version !== '0.2.1-alpha.1' || p.scripts?.prepare) throw new Error('Invalid installed package')
          console.log('GIT_INSTALL_WITHOUT_ALLOWBUILDS_PASSED')
          NODE
      - name: Publish GitHub prerelease with the same tested tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.2.1-alpha.1'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Tag already published; refusing to replace release'
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## DSH Codex Native v0.2.1-alpha.1 — GitHub install hotfix
          
          Fixes DSH Desktop pnpm error `ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED` from the alpha.0 Git install.
          The Git tag includes fully compiled `lib/index.js`, `lib/client.js`, and declarations, and its package manifest has **no `prepare` lifecycle build script**. A pnpm consumer with no custom `allowBuilds` entries completed direct GitHub-tag installation in the isolated release workflow.
          
          **DSH Desktop → Plugins → Add plugin:**
          
          ```text
          github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.1
          ```
          
          Enable the plugin, restart DSH, open Settings → Codex official login, and select `codex-local`.
          No separate OpenAI API Key or npm account is needed. Normal runtime files still occupy installed-plugin storage.
          
          **This is an alpha testing prerelease.** Actual DSH Windows Desktop integration, account authentication and subscribed Codex model/tool round-trips have not yet been verified in a user's machine.
          
          MIT upstream attribution remains in LICENSE and README.
          NOTES
          gh release create "$TAG" 'dist/dsh-codex-native-0.2.1-alpha.1.tgz' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --title "DSH Codex Native v0.2.1-alpha.1 (GitHub install fix)" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
