name: Native DSH usage previews (light and dark)
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-preview.yml'
      - 'tests/docs-preview.spec.tsx'
      - 'vitest.config.ts'
      - 'src/client/UsagePanel.tsx'
      - 'src/client/ui-style.ts'
      - 'src/client/native-locales.ts'
  workflow_dispatch:
concurrency:
  group: original-ui-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317
          path: .tmp/dsh-reference
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Render actual controls with labelled illustrative data
        env:
          DSH_DOC_PREVIEW_OUTPUT: ${{ runner.temp }}/codex-native-preview
          DSH_REFERENCE_ROOT: ${{ github.workspace }}/.tmp/dsh-reference
        run: pnpm exec vitest run tests/docs-preview.spec.tsx
      - name: Capture light and dark token previews
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          mkdir -p docs/screenshots
          for MODE in light dark; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=820,800 \
              --screenshot="$GITHUB_WORKSPACE/docs/screenshots/codex-usage-$MODE.png" "file://$RUNNER_TEMP/codex-native-preview/usage-$MODE.html"
            test -s "docs/screenshots/codex-usage-$MODE.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-control-usage-previews
          path: docs/screenshots/codex-usage-*.png
      - name: Commit only own preview images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/codex-usage-light.png docs/screenshots/codex-usage-dark.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: actual DSH-control usage previews with sample-data captions'
            git restore --worktree -- .
            git fetch origin main
            if ! git diff --quiet HEAD..origin/main -- src/client/UsagePanel.tsx src/client/native-locales.ts src/client/ui-style.ts tests/docs-preview.spec.tsx; then
              echo 'Preview inputs changed; not publishing stale screenshots'
              exit 1
            fi
            git rebase origin/main
            git push origin HEAD:main
          fi
