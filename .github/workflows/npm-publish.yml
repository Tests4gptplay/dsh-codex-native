name: Publish Codex Native packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_unscoped:
        description: Publish unscoped package (requires its first manual publish and npm trust)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: codex-native-npm-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: npm install --global npm@11.20.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - name: Verify changed capacity discovery and package metadata
        run: pnpm exec vitest run tests/computer-use-recovery.spec.ts tests/computer-use-profiles.spec.ts tests/model-capacity-discovery.spec.ts tests/native-account.spec.ts tests/adapter.spec.ts tests/package-metadata.spec.ts
      - run: pnpm run build
      - run: node scripts/package-release.mjs
      - name: Sign unscoped first-publication bundle without uploading an npm token
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_unscoped
        run: node scripts/bootstrap-provenance.cjs
      - name: Bind tag to package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-native-packages-${{ env.VERSION }}
          path: dist/*
      - name: Publish scoped package with npm OIDC
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@tests4gptplay/dsh-codex-native@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo 'Exact scoped version already exists; retaining immutable release.'
          else
            npm publish "./dist/tests4gptplay-dsh-codex-native-$VERSION.tgz" --access public --provenance
          fi
      - name: Publish unscoped package with npm OIDC
        if: github.event_name == 'push' || inputs.publish_unscoped
        shell: bash
        run: |
          set -euo pipefail
          if npm view "dsh-codex-native@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo 'Exact unscoped version already exists; retaining immutable release.'
          else
            npm publish "./dist/dsh-codex-native-$VERSION.tgz" --access public --provenance
          fi
      - name: Publish GitHub release and both packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite its assets.'
          else
            gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Codex Native $VERSION — automatic context capacity" --notes-file RELEASE_NOTES.md --latest
          fi
