name: Publish verified minimal Codex Native release
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/release-clean.yml']
  workflow_dispatch:
    inputs:
      tested_run_id:
        description: Successful Linux and Windows regression run
        required: true
        default: '39947758087'
permissions:
  contents: write
  actions: read
concurrency:
  group: codex-native-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTED_RUN: ${{ inputs.tested_run_id || '39947758087' }}
    steps:
      - name: Require successful Ubuntu and Windows regression jobs from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN/jobs" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          import {join} from 'node:path'
          const run=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'run.json'),'utf8'))
          const jobs=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'jobs.json'),'utf8')).jobs
          if(run.status!=='completed'||run.conclusion!=='success')throw Error('Tested CI has not passed')
          for(const name of ['build (ubuntu-latest)','build (windows-latest)']){
            if(!jobs.some(j=>j.name===name&&j.conclusion==='success'))throw Error('Missing passed job: '+name)
          }
          appendFileSync(process.env.GITHUB_ENV,'TESTED_SHA='+run.head_sha+'\n')
          NODE
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.TESTED_RUN }}
          github-token: ${{ github.token }}
          name: codex-reproduction-ubuntu-latest
          path: verified-artifact
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Form source-free runtime from tested bundle only
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(find verified-artifact -type f -name 'dsh-codex-native-*.tgz' -print -quit)"
          test -n "$TGZ"
          STAGE="$RUNNER_TEMP/release-runtime"
          mkdir -p "$STAGE" dist
          tar -xzf "$TGZ" --strip-components=1 -C "$STAGE"
          STAGE="$STAGE" node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,readdirSync,appendFileSync} from 'node:fs'
          import {join,relative} from 'node:path'
          const root=process.env.STAGE
          const p=JSON.parse(readFileSync(join(root,'package.json'),'utf8'))
          if(p.name!=='dsh-codex-native'||p.version!=='0.2.1-alpha.4')throw Error('Unexpected candidate identity')
          for(const field of ['scripts','devDependencies','packageManager','publishConfig'])delete p[field]
          writeFileSync(join(root,'package.json'),JSON.stringify(p,null,2)+'\n')
          const intro='DSH Codex Native '+p.version+' — test preview\n\nGitHub installer: github:Tests4gptplay/dsh-codex-native#v'+p.version+'\n\nFixes new codex-action unknown chat blocks and starts the official Codex Windows binary directly through DSH. Historical chat logs are not rewritten. No test, mock backend, source, CI or install scripts are shipped.\n\nLinux/Windows mock-stdio and official DSH renderer regressions passed. The real Windows Codex binary completed an isolated unauthenticated handshake. Actual Desktop console visibility and subscribed model calls are not certified.\n\nSource and attribution: https://github.com/Tests4gptplay/dsh-codex-native\n'
          writeFileSync(join(root,'README.md'),intro)
          writeFileSync(join(root,'README.zh.md'),'# DSH Codex Native '+p.version+' 测试版\n\n安装：github:Tests4gptplay/dsh-codex-native#v'+p.version+'\n\n修复新回复里的未知内容块，并在 Windows 由 DSH 直接启动官方 Codex 二进制。不会修改旧聊天记录。发行物没有测试文件、模拟后端、源码、CI 或安装脚本。\n\nLinux/Windows 回归和 Windows 无账号握手已通过；实际桌面窗口可见性和订阅模型调用仍待实机确认。\n\n源码及许可：https://github.com/Tests4gptplay/dsh-codex-native\n')
          const all=[]
          function walk(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const f=join(dir,e.name);if(e.isDirectory())walk(f);else all.push(relative(root,f).replaceAll('\\','/'))}}
          walk(root)
          const allowed=new Set(['package.json','cordis.patch.yml','LICENSE','README.md','README.zh.md'])
          for(const f of all)if(!allowed.has(f)&&!/^lib\/(?:index\.js|client\.js|(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.d\.ts)$/.test(f))throw Error('Unexpected installed file: '+f)
          for(const f of ['lib/index.js','lib/client.js']){
            const js=readFileSync(join(root,f),'utf8')
            for(const token of ['mock-app-server.mjs','TEST_CODEX_SCENARIO','vitest'])if(js.includes(token))throw Error('Test code leaked into '+f)
          }
          if(p.scripts||p.devDependencies)throw Error('Development lifecycle leaked into runtime')
          console.log('SOURCE_FREE_TEST_FREE_RUNTIME files='+all.length)
          appendFileSync(process.env.GITHUB_ENV,'RELEASE_TAG=v'+p.version+'\nDIST_STAGE='+root+'\n')
          NODE
          (cd "$STAGE" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          test -s dist/dsh-codex-native-0.2.1-alpha.4.tgz
      - name: Clean installation through official DSH profile
        env:
          DSH_HOME: ${{ runner.temp }}/release-dsh-smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 plugin --profile web add "$GITHUB_WORKSPACE/dist/dsh-codex-native-0.2.1-alpha.4.tgz"
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 --profile web --dump-config > "$RUNNER_TEMP/composed.txt"
          grep -Fq codex-local "$RUNNER_TEMP/composed.txt"
      - name: Publish immutable runtime-only tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing overwrite'; exit 1; fi
          cd "$DIST_STAGE"
          git init -q -b release-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "release: verified runtime $RELEASE_TAG from $TESTED_SHA"
          git tag "$RELEASE_TAG"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -q origin "refs/tags/$RELEASE_TAG"
      - name: Verify exact GitHub installation without build exceptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/git-consumer"
          cd "$RUNNER_TEMP/git-consumer"
          printf '{"name":"temporary-consumer","private":true,"version":"1.0.0"}\n' > package.json
          printf 'packages:\n  - .\nautoInstallPeers: false\n' > pnpm-workspace.yaml
          pnpm add "github:$GITHUB_REPOSITORY#$RELEASE_TAG"
          P="$(realpath node_modules/dsh-codex-native)"
          test -s "$P/lib/index.js"
          test -s "$P/lib/client.js"
          for NAME in tests src scripts .github; do test ! -e "$P/$NAME"; done
          P="$P" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import {join} from 'node:path'
          const p=JSON.parse(readFileSync(join(process.env.P,'package.json'),'utf8'))
          if(p.scripts||p.devDependencies)throw Error('Unexpected install scripts or dev dependencies')
          console.log('EXACT_GITHUB_INSTALL_PASSED')
          NODE
      - name: Publish verified GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          # Codex Native alpha.4 — unknown-content and Windows launch fix
          
          Paste in DSH Desktop Plugins → Add plugin:
          
          ```text
          github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.4
          ```
          
          - New replies use standard DSH content. Empty moderation/lifecycle diagnostics no longer appear as unknown JSON. Actual errors, replies, tools and replay data are preserved.
          - Windows login and model processes launch the official packaged Codex executable directly through DSH's process manager, avoiding the wrapper's unhidden second spawn.
          - Mock stdio + official DSH 0.2.1 renderer tests passed on Linux and Windows; the real Windows Codex binary completed an isolated no-account initialize/account-read.
          - Historical messages are not rewritten. The hosted Windows test is not a visual Electron Desktop test or a live subscribed model test.
          - No tests, mock backend, source, CI, scripts or devDependencies in this immutable installation tag.
          
          MIT upstream attribution remains in LICENSE. This is a community preview, not an official OpenAI/DeepSeek plugin.
          NOTES
          printf '\nRegression CI: https://github.com/%s/actions/runs/%s\nSource commit: %s\n' "$GITHUB_REPOSITORY" "$TESTED_RUN" "$TESTED_SHA" >> "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" dist/dsh-codex-native-0.2.1-alpha.4.tgz --repo "$GITHUB_REPOSITORY" --prerelease --title 'DSH Codex Native alpha.4 — native content and Windows launch' --notes-file "$RUNNER_TEMP/notes.md"
