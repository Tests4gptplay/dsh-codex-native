name: Publish verified minimal Codex Native release
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/release-clean.yml']
  workflow_dispatch:
    inputs:
      tested_run_id:
        description: Successful Linux and Windows regression run
        required: true
        default: '39996592077'
permissions:
  contents: write
  actions: read
concurrency:
  group: codex-native-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTED_RUN: ${{ inputs.tested_run_id || '39996592077' }}
      RELEASE_VERSION: '0.2.1-alpha.6'
    steps:
      - name: Require successful Ubuntu and Windows regression jobs from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN/jobs" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          import {join} from 'node:path'
          const run=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'run.json'),'utf8'))
          const jobs=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'jobs.json'),'utf8')).jobs
          if(run.status!=='completed'||run.conclusion!=='success')throw Error('Tested CI has not passed')
          for(const name of ['build (ubuntu-latest)','build (windows-latest)']){
            if(!jobs.some(j=>j.name===name&&j.conclusion==='success'))throw Error('Missing passed job: '+name)
          }
          appendFileSync(process.env.GITHUB_ENV,'TESTED_SHA='+run.head_sha+'\n')
          NODE
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.TESTED_RUN }}
          github-token: ${{ github.token }}
          name: codex-reproduction-ubuntu-latest
          path: verified-artifact
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Form source-free runtime from tested bundle only
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(find verified-artifact -type f -name 'dsh-codex-native-*.tgz' -print -quit)"
          test -n "$TGZ"
          STAGE="$RUNNER_TEMP/release-runtime"
          mkdir -p "$STAGE" dist
          tar -xzf "$TGZ" --strip-components=1 -C "$STAGE"
          STAGE="$STAGE" node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,readdirSync,appendFileSync} from 'node:fs'
          import {join,relative} from 'node:path'
          const root=process.env.STAGE
          const p=JSON.parse(readFileSync(join(root,'package.json'),'utf8'))
          if(p.name!=='dsh-codex-native'||p.version!==process.env.RELEASE_VERSION)throw Error('Unexpected candidate identity')
          for(const field of ['scripts','devDependencies','packageManager','publishConfig'])delete p[field]
          writeFileSync(join(root,'package.json'),JSON.stringify(p,null,2)+'\n')
          const spec='github:Tests4gptplay/dsh-codex-native#v'+p.version
          writeFileSync(join(root,'README.md'),`# DSH Codex Native ${p.version}

          Install in DSH Plugins → Add plugin:

          ${spec}

          Official Codex app-server main-model adapter with native ChatGPT login and manual account usage history. Independent community integration; MIT attribution is retained in LICENSE.

          ## alpha.6 protocol lifecycle fix

          Closed pipes now settle blocked requests instead of waiting forever for drain. Transport errors retain local process exit/stderr evidence, with common credential shapes redacted; an exit first observed during cleanup is labelled accordingly. Already-closed cached threads are rebuilt from recorded history on the next request, including existing tool results, without adding automatic in-flight tool replay.

          No heartbeat, reconnect poller, watchdog or new hard model-task timer is added. Existing DSH retry settings are unchanged. This repair does not prove why the user's original local process exited or that OpenAI's cloud was down.

          The alpha.5 manual Query/Clear history UI and native DSH controls remain. Token history is account-wide; historical reset groups reference codex-reset.com and are approximate UTC-date groupings. Clear empties the view only. No account data is sent to that reference site.

          Production tag contains compiled runtime, declarations, metadata, license and READMEs only. Tests, mock processes, source, CI, screenshots, install scripts and devDependencies are excluded. Ubuntu and Windows regression tests, including a real isolated child exit, passed; no real user account or live model quota was used.

          Fully restart DSH after upgrading. Source, detailed boundaries and evidence: https://github.com/Tests4gptplay/dsh-codex-native
          `.replace(/^          /gm,''))
          writeFileSync(join(root,'README.zh.md'),`# DSH Codex Native ${p.version}

          DSH 插件 → 添加插件：

          ${spec}

          通过 OpenAI 官方 Codex app-server 接入 DSH 主模型，提供 ChatGPT 原生登录和手动账号历史用量查询。本插件为独立社区项目，保留原 MIT 许可和署名。

          ## alpha.6 协议断流修复

          修复管道关闭后仍等 drain 导致请求挂起的问题；保留本地进程退出码与标准错误证据，并遮盖常见凭据内容。在清理阶段才观察到的退出明确标注，不冒充最初原因。已关闭的缓存连接在下一次请求时按已有历史重建，工具结果作为已有记录保留，不新增执行途中自动重放。

          不增加心跳、轮询、Watchdog 或模型任务硬超时；原有 DSH 重试设置不变。用户最初为何退出仍需实际退出日志确认，不能据此认定 OpenAI 云端宕机。

          保留 alpha.5 的手动查询、单清除按钮、折叠每日用量及 DSH 官方控件。Token 是账号口径；历史周期参考 codex-reset.com，按 UTC 日期归组，仅供参考。清除只清本页显示，第三方不接收账号或用量数据。

          安装标签只包含编译运行文件、声明、配置、许可证和说明；不含测试、模拟后端、源码、CI、截图、安装脚本或开发依赖。Linux/Windows 回归及隔离真实子进程退出测试通过，未使用真实账号或模型额度。

          升级后完全退出并重新打开 DSH。源码和详细证据：https://github.com/Tests4gptplay/dsh-codex-native
          `.replace(/^          /gm,''))
          const all=[]
          function walk(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const f=join(dir,e.name);if(e.isDirectory())walk(f);else all.push(relative(root,f).replaceAll('\\','/'))}}
          walk(root)
          const allowed=new Set(['package.json','cordis.patch.yml','LICENSE','README.md','README.zh.md'])
          for(const f of all)if(!allowed.has(f)&&!/^lib\/(?:index\.js|client\.js|(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.d\.ts)$/.test(f))throw Error('Unexpected installed file: '+f)
          for(const f of ['lib/index.js','lib/client.js']){
            const js=readFileSync(join(root,f),'utf8')
            for(const token of ['mock-app-server.mjs','TEST_CODEX_SCENARIO','fixture-secret','vitest','#dsh-primitives','tests/official-primitives'])if(js.includes(token))throw Error('Test code leaked into '+f)
          }
          const client=readFileSync(join(root,'lib/client.js'),'utf8')
          if(!client.includes('@deepseek-ai/dsh-client-ui-primitives'))throw Error('Client lost shared official-control dependency')
          if(p.scripts||p.devDependencies)throw Error('Development lifecycle leaked into runtime')
          console.log('SOURCE_FREE_TEST_FREE_RUNTIME files='+all.length)
          appendFileSync(process.env.GITHUB_ENV,'RELEASE_TAG=v'+p.version+'\nDIST_STAGE='+root+'\n')
          NODE
          (cd "$STAGE" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          test -s "dist/dsh-codex-native-$RELEASE_VERSION.tgz"
      - name: Clean installation through official DSH profile
        env:
          DSH_HOME: ${{ runner.temp }}/release-dsh-smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 plugin --profile web add "$GITHUB_WORKSPACE/dist/dsh-codex-native-$RELEASE_VERSION.tgz"
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 --profile web --dump-config > "$RUNNER_TEMP/composed.txt"
          grep -Fq codex-local "$RUNNER_TEMP/composed.txt"
      - name: Publish immutable runtime-only tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing overwrite'; exit 1; fi
          cd "$DIST_STAGE"
          git init -q -b release-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "release: verified runtime $RELEASE_TAG from $TESTED_SHA"
          git tag "$RELEASE_TAG"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -q origin "refs/tags/$RELEASE_TAG"
      - name: Verify exact GitHub installation without build exceptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/git-consumer"
          cd "$RUNNER_TEMP/git-consumer"
          printf '{"name":"temporary-consumer","private":true,"version":"1.0.0"}\n' > package.json
          printf 'packages:\n  - .\nautoInstallPeers: false\n' > pnpm-workspace.yaml
          pnpm add "github:$GITHUB_REPOSITORY#$RELEASE_TAG"
          P="$(realpath node_modules/dsh-codex-native)"
          test -s "$P/lib/index.js"
          test -s "$P/lib/client.js"
          for NAME in tests src scripts .github; do test ! -e "$P/$NAME"; done
          P="$P" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import {join} from 'node:path'
          const p=JSON.parse(readFileSync(join(process.env.P,'package.json'),'utf8'))
          if(p.scripts||p.devDependencies)throw Error('Unexpected install scripts or dev dependencies')
          console.log('EXACT_GITHUB_INSTALL_PASSED')
          NODE
      - name: Publish verified GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          # Codex Native alpha.6 — protocol stream lifecycle fix

          DSH Desktop: Plugins → Add plugin:

          ```text
          github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.6
          ```

          - Fix requests hanging on backpressured writes after protocol EOF or pipe closure.
          - Preserve process exit and stderr evidence instead of losing it behind the generic stream-closed error; mask common credential shapes and label cleanup-time exit observations.
          - Rebuild an already-closed cached connection on the next request using recorded history and tool outputs. No new automatic replay of in-flight operations.
          - Observe account-process startup failures even when stdout emits no event; cleanup cannot wait indefinitely on a second unbounded process promise.
          - Preserve manual usage queries, native DSH controls, existing cancellation, model policy and host retry settings. No new watchdog, heartbeat, usage poller or hard model-task limit.
          - Tested with isolated streams and a real fixture subprocess through the official DSH runtime on Linux and Windows. No real account or model quota was used.
          - Installer tag and TGZ exclude tests, mocks, source, CI, screenshots, scripts and devDependencies; exact GitHub installation does not require allowBuilds exceptions.

          **Boundary:** the initiating cause of the user's original process exit is not yet proven. This fixes confirmed plugin-side failure handling, not every possible native Codex or cloud failure. Existing native interactive-approval limitations remain.

          Upgrade, then fully quit and reopen DSH. If it recurs, the new error should retain more diagnostic evidence; remove personal paths before sharing it.

          Details: https://github.com/Tests4gptplay/dsh-codex-native/blob/main/docs/PROTOCOL_STREAM_FIX.md
          NOTES
          printf '\nRegression CI: https://github.com/%s/actions/runs/%s\nSource commit: %s\n' "$GITHUB_REPOSITORY" "$TESTED_RUN" "$TESTED_SHA" >> "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" "dist/dsh-codex-native-$RELEASE_VERSION.tgz" --repo "$GITHUB_REPOSITORY" --prerelease --title 'DSH Codex Native alpha.6 — protocol stream lifecycle fix' --notes-file "$RUNNER_TEMP/notes.md"
