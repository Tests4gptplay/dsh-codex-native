name: Publish verified minimal Codex Native release
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/release-clean.yml']
  workflow_dispatch:
    inputs:
      tested_run_id:
        description: Successful Linux and Windows regression run
        required: true
        default: '39959031468'
permissions:
  contents: write
  actions: read
concurrency:
  group: codex-native-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTED_RUN: ${{ inputs.tested_run_id || '39959031468' }}
      RELEASE_VERSION: '0.2.1-alpha.5'
    steps:
      - name: Require successful Ubuntu and Windows regression jobs from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN/jobs" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          import {join} from 'node:path'
          const run=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'run.json'),'utf8'))
          const jobs=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'jobs.json'),'utf8')).jobs
          if(run.status!=='completed'||run.conclusion!=='success')throw Error('Tested CI has not passed')
          for(const name of ['build (ubuntu-latest)','build (windows-latest)']){
            if(!jobs.some(j=>j.name===name&&j.conclusion==='success'))throw Error('Missing passed job: '+name)
          }
          appendFileSync(process.env.GITHUB_ENV,'TESTED_SHA='+run.head_sha+'\n')
          NODE
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.TESTED_RUN }}
          github-token: ${{ github.token }}
          name: codex-reproduction-ubuntu-latest
          path: verified-artifact
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Form source-free runtime from tested bundle only
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(find verified-artifact -type f -name 'dsh-codex-native-*.tgz' -print -quit)"
          test -n "$TGZ"
          STAGE="$RUNNER_TEMP/release-runtime"
          mkdir -p "$STAGE" dist
          tar -xzf "$TGZ" --strip-components=1 -C "$STAGE"
          STAGE="$STAGE" node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,readdirSync,appendFileSync} from 'node:fs'
          import {join,relative} from 'node:path'
          const root=process.env.STAGE
          const p=JSON.parse(readFileSync(join(root,'package.json'),'utf8'))
          if(p.name!=='dsh-codex-native'||p.version!==process.env.RELEASE_VERSION)throw Error('Unexpected candidate identity')
          for(const field of ['scripts','devDependencies','packageManager','publishConfig'])delete p[field]
          writeFileSync(join(root,'package.json'),JSON.stringify(p,null,2)+'\n')
          const spec='github:Tests4gptplay/dsh-codex-native#v'+p.version
          writeFileSync(join(root,'README.md'),'# DSH Codex Native '+p.version+'\n\nInstall: '+spec+'\n\nOfficial Codex app-server main-model adapter. Settings now offers manual account usage queries using account/usage/read, with native DSH Button/DisclosureRow and skin-owned theme tokens. One Clear button, Query, and listed total sit above collapsible reference periods and daily rows. Token and reset provenance appear below the table.\n\nHistorical reset reference: codex-reset.com public announcements. Periods are approximate UTC-date groups, not individual account reset history. Clear removes only the local displayed result; Query restores official history. No usage polling, model hooks, token accumulation, reset-credit consumption or external account credential sharing.\n\nProduction tag contains only compiled runtime, declarations, metadata, license and READMEs. Tests, fixtures, screenshots, source, CI, scripts and devDependencies are excluded. Linux/Windows regressions passed; a real account history response and every third-party skin have not been verified in cloud CI.\n\nSource and MIT attribution: https://github.com/Tests4gptplay/dsh-codex-native\n')
          writeFileSync(join(root,'README.zh.md'),'# DSH Codex Native '+p.version+'\n\n安装：'+spec+'\n\n设置页新增手动历史查询，使用 Codex 官方 account/usage/read；按钮和折叠行直接复用 DSH 官方控件及皮肤变量。顶部只有清除、查询和列表总用量；下方按参考周期折叠，每组可展开每日明细。表格下标明用量与周期来源。\n\n历史周期参考 codex-reset.com 公共公告，不是个人账户完整重置历史。重置当天用量不拆分；清除只清空本页结果，再次查询会恢复官方历史。没有用量轮询、模型统计钩子或自动重置操作，也不向第三方发送账户凭据或用量。\n\n精简发行标签没有测试、模拟数据、截图、源码、CI、构建脚本或开发依赖。Windows/Linux 回归通过；未在云端使用真实账号查询，也未声称所有第三方皮肤均已实测。\n\n源码、许可与来源：https://github.com/Tests4gptplay/dsh-codex-native\n')
          const all=[]
          function walk(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const f=join(dir,e.name);if(e.isDirectory())walk(f);else all.push(relative(root,f).replaceAll('\\','/'))}}
          walk(root)
          const allowed=new Set(['package.json','cordis.patch.yml','LICENSE','README.md','README.zh.md'])
          for(const f of all)if(!allowed.has(f)&&!/^lib\/(?:index\.js|client\.js|(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.d\.ts)$/.test(f))throw Error('Unexpected installed file: '+f)
          for(const f of ['lib/index.js','lib/client.js']){
            const js=readFileSync(join(root,f),'utf8')
            for(const token of ['mock-app-server.mjs','TEST_CODEX_SCENARIO','vitest','#dsh-primitives','tests/official-primitives'])if(js.includes(token))throw Error('Test code leaked into '+f)
          }
          const client=readFileSync(join(root,'lib/client.js'),'utf8')
          if(!client.includes('@deepseek-ai/dsh-client-ui-primitives'))throw Error('Client lost shared official-control dependency')
          if(p.scripts||p.devDependencies)throw Error('Development lifecycle leaked into runtime')
          console.log('SOURCE_FREE_TEST_FREE_RUNTIME files='+all.length)
          appendFileSync(process.env.GITHUB_ENV,'RELEASE_TAG=v'+p.version+'\nDIST_STAGE='+root+'\n')
          NODE
          (cd "$STAGE" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          test -s "dist/dsh-codex-native-$RELEASE_VERSION.tgz"
      - name: Clean installation through official DSH profile
        env:
          DSH_HOME: ${{ runner.temp }}/release-dsh-smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 plugin --profile web add "$GITHUB_WORKSPACE/dist/dsh-codex-native-$RELEASE_VERSION.tgz"
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 --profile web --dump-config > "$RUNNER_TEMP/composed.txt"
          grep -Fq codex-local "$RUNNER_TEMP/composed.txt"
      - name: Publish immutable runtime-only tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing overwrite'; exit 1; fi
          cd "$DIST_STAGE"
          git init -q -b release-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "release: verified runtime $RELEASE_TAG from $TESTED_SHA"
          git tag "$RELEASE_TAG"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -q origin "refs/tags/$RELEASE_TAG"
      - name: Verify exact GitHub installation without build exceptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/git-consumer"
          cd "$RUNNER_TEMP/git-consumer"
          printf '{"name":"temporary-consumer","private":true,"version":"1.0.0"}\n' > package.json
          printf 'packages:\n  - .\nautoInstallPeers: false\n' > pnpm-workspace.yaml
          pnpm add "github:$GITHUB_REPOSITORY#$RELEASE_TAG"
          P="$(realpath node_modules/dsh-codex-native)"
          test -s "$P/lib/index.js"
          test -s "$P/lib/client.js"
          for NAME in tests src scripts .github; do test ! -e "$P/$NAME"; done
          P="$P" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import {join} from 'node:path'
          const p=JSON.parse(readFileSync(join(process.env.P,'package.json'),'utf8'))
          if(p.scripts||p.devDependencies)throw Error('Unexpected install scripts or dev dependencies')
          console.log('EXACT_GITHUB_INSTALL_PASSED')
          NODE
      - name: Publish verified GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          # Codex Native alpha.5 — manual usage history and native DSH controls
          
          Desktop Plugins → Add plugin:
          
          ```text
          github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.5
          ```
          
          - Manually query official account history; no usage polling or independent token accumulator.
          - Single top Clear and Query controls alongside the listed total; collapsible reference periods with daily usage rows.
          - Actual DSH Button/DisclosureRow components and skin-owned tokens, not a separately styled button library.
          - Below-table notes distinguish OpenAI Codex token history, codex-reset.com public reset announcements, and official current/next quota windows. Periods are reference-only UTC-date groupings; reset-day usage is not split into invented intraday fractions.
          - Clear empties the local view only. Query restores official history; no server history or conversation is deleted.
          - Public fallback receives no account data, cookies, tokens or usage; on-demand cache respects the site's publication cadence. An unavailable reference source does not block model execution or discard returned official tokens.
          - No tests, mock data, source, screenshots, CI, scripts or devDependencies in the installer tag.
          
          Account-authenticated history and every third-party Desktop skin were not tested with real credentials. Current model, login and native-approval limitations are not changed by this reporting feature.
          
          Sources: https://developers.openai.com/codex/app-server/ and https://codex-reset.com/developers . MIT attribution remains in LICENSE.
          NOTES
          printf '\nRegression CI: https://github.com/%s/actions/runs/%s\nSource commit: %s\n' "$GITHUB_REPOSITORY" "$TESTED_RUN" "$TESTED_SHA" >> "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" "dist/dsh-codex-native-$RELEASE_VERSION.tgz" --repo "$GITHUB_REPOSITORY" --prerelease --title 'DSH Codex Native alpha.5 — manual history and native UI' --notes-file "$RUNNER_TEMP/notes.md"
