name: Release minimal DSH Codex Native alpha.3
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/release-clean.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: minimal-codex-alpha3
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Account-free source verification and production build
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run test:ci
          pnpm run build
      - name: Assemble minimum source-free runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/runtime-only"
          mkdir -p "$STAGE/lib" dist
          cp lib/index.js lib/client.js "$STAGE/lib/"
          find lib -name '*.d.ts' | while read -r FILE; do
            mkdir -p "$STAGE/$(dirname "$FILE")"
            cp "$FILE" "$STAGE/$FILE"
          done
          cp LICENSE cordis.patch.yml "$STAGE/"
          printf '%s\n' '# DSH Codex Native alpha.3' 'GitHub installer: github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.3' 'Source: https://github.com/Tests4gptplay/dsh-codex-native' 'Account login and native approvals remain unverified in the actual desktop Host.' > "$STAGE/README.md"
          printf '%s\n' '# DSH Codex Native alpha.3 精简版' '桌面安装：github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.3' '源码和审计：https://github.com/Tests4gptplay/dsh-codex-native' '真实账号登录与原生审批尚待桌面实测。' > "$STAGE/README.zh.md"
          STAGE="$STAGE" node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,readdirSync} from 'node:fs'
          import {join,relative} from 'node:path'
          const stage=process.env.STAGE, manifest=JSON.parse(readFileSync('package.json','utf8'))
          if(manifest.version !== '0.2.1-alpha.3') throw Error('Unexpected source version')
          for(const k of ['scripts','devDependencies','packageManager','publishConfig']) delete manifest[k]
          manifest.files=['lib/index.js','lib/client.js','lib/**/*.d.ts','cordis.patch.yml','LICENSE','README.md','README.zh.md']
          writeFileSync(join(stage,'package.json'),JSON.stringify(manifest,null,2)+'\n')
          const all=[]
          function visit(d){for(const ent of readdirSync(d,{withFileTypes:true})){const f=join(d,ent.name);if(ent.isDirectory())visit(f);else all.push(relative(stage,f).replaceAll('\\','/'))}}
          visit(stage)
          const roots=new Set(['package.json','LICENSE','cordis.patch.yml','README.md','README.zh.md'])
          for(const f of all) if(!roots.has(f)&&!/^lib\/(?:index\.js|client\.js|(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.d\.ts)$/.test(f))throw Error('Unexpected runtime path '+f)
          for(const f of ['lib/index.js','lib/client.js',...roots])if(!all.includes(f))throw Error('Missing runtime path '+f)
          if(manifest.scripts||manifest.devDependencies)throw Error('Development lifecycle in package')
          console.log('MINIMAL_RUNTIME_PACKAGED '+all.length+' files')
          NODE
          (cd "$STAGE" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          test -s dist/dsh-codex-native-0.2.1-alpha.3.tgz
          tar -czf dist/minimal-runtime-tree.tar.gz -C "$STAGE" .
      - name: Clean pnpm tarball installation without allowBuilds changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pnpm-consumer"
          cd "$RUNNER_TEMP/pnpm-consumer"
          printf '{"name":"temporary-consumer","private":true,"version":"1.0.0"}\n' > package.json
          printf 'packages:\n  - .\nautoInstallPeers: false\n' > pnpm-workspace.yaml
          pnpm add "$GITHUB_WORKSPACE/dist/dsh-codex-native-0.2.1-alpha.3.tgz"
          P="$(realpath node_modules/dsh-codex-native)"
          test -s "$P/lib/index.js"
          test -s "$P/lib/client.js"
          for NAME in tests src scripts .github; do test ! -e "$P/$NAME"; done
          P="$P" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import {join} from 'node:path'
          const p=JSON.parse(readFileSync(join(process.env.P,'package.json'),'utf8'))
          if(p.scripts||p.devDependencies)throw Error('Unexpected test/build lifecycle')
          console.log('CLEAN_PNPM_INSTALL_PASSED')
          NODE
      - name: DSH official Web profile loading smoke on Linux
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-linux-smoke
        run: |
          set -euo pipefail
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 plugin --profile web add "$GITHUB_WORKSPACE/dist/dsh-codex-native-0.2.1-alpha.3.tgz"
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 --profile web --dump-config > "$RUNNER_TEMP/dsh-profile.txt"
          grep -Fq codex-local "$RUNNER_TEMP/dsh-profile.txt"
          echo LINUX_DSH_BUNDLE_SMOKE_PASSED
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-alpha3-packages
          path: |
            dist/dsh-codex-native-0.2.1-alpha.3.tgz
            dist/minimal-runtime-tree.tar.gz
  windows-smoke:
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: minimal-alpha3-packages
          path: dist
      - name: DSH official Web profile loading smoke on Windows
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-windows-smoke
        run: |
          $ErrorActionPreference='Stop'
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 plugin --profile web add "$env:GITHUB_WORKSPACE/dist/dsh-codex-native-0.2.1-alpha.3.tgz"
          if($LASTEXITCODE -ne 0) { throw 'Windows DSH plugin install failed' }
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.2 --profile web --dump-config | Out-File -Encoding utf8 "$env:RUNNER_TEMP/dsh-profile.txt"
          if($LASTEXITCODE -ne 0) { throw 'Windows DSH profile composition failed' }
          if(-not (Select-String -Path "$env:RUNNER_TEMP/dsh-profile.txt" -Pattern 'codex-local' -Quiet)) { throw 'No Codex main-model route in DSH config' }
          Write-Output WINDOWS_DSH_BUNDLE_SMOKE_PASSED
  publish:
    needs: [build-test, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: minimal-alpha3-packages
          path: dist
      - name: Create immutable minimal GitHub tag after both Host smoke tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.2.1-alpha.3
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo 'Ref already exists'; exit 1; fi
          mkdir -p "$RUNNER_TEMP/git-snapshot"
          tar -xzf dist/minimal-runtime-tree.tar.gz -C "$RUNNER_TEMP/git-snapshot"
          cd "$RUNNER_TEMP/git-snapshot"
          git init -q -b release-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm 'release: minimum audited DSH Codex runtime alpha.3'
          git tag "$TAG"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -q origin "refs/tags/$TAG"
      - name: Confirm GitHub tag resolves without build approval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tag-consumer"
          cd "$RUNNER_TEMP/tag-consumer"
          printf '{"name":"tag-consumer","private":true,"version":"1.0.0"}\n' > package.json
          printf 'packages:\n  - .\nautoInstallPeers: false\n' > pnpm-workspace.yaml
          pnpm add 'github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.3'
          P="$(realpath node_modules/dsh-codex-native)"
          test -s "$P/lib/index.js"
          test -s "$P/lib/client.js"
          for NAME in tests src scripts .github; do test ! -e "$P/$NAME"; done
          P="$P" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import {join} from 'node:path'
          const p=JSON.parse(readFileSync(join(process.env.P,'package.json'),'utf8'))
          if(p.scripts||p.devDependencies)throw Error('Development scripts or dependencies installed')
          console.log('CLEAN_GITHUB_INSTALL_PASSED')
          NODE
      - name: Attach slim package to testing GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.1-alpha.3 dist/dsh-codex-native-0.2.1-alpha.3.tgz \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "DSH Codex Native alpha.3 (minimal runtime testing)" \
            --notes "GitHub install: github:Tests4gptplay/dsh-codex-native#v0.2.1-alpha.3. This test build has no tests, source, install hooks or development dependencies. Hosted Linux/Windows DSH composition and clean Git installation passed. Live subscribed authentication, DSH Desktop use and native Codex approval interaction are not yet verified."
