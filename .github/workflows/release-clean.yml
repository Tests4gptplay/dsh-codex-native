name: Publish verified minimal Codex Native release
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/release-clean.yml']
  workflow_dispatch:
    inputs:
      tested_run_id:
        description: Successful versioned candidate run (must match the pinned source)
        required: true
        default: '40078589328'
permissions:
  contents: write
  actions: read
concurrency:
  group: codex-native-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TESTED_RUN: ${{ inputs.tested_run_id || '40078589328' }}
      EXPECTED_SOURCE_SHA: '455d273e8ea6825a5275e665845a5557e068b0cd'
      RELEASE_VERSION: '0.2.1-alpha.8'
      RELEASE_TAG: 'v0.2.1-alpha.8'
    steps:
      - name: Bind release to successful versioned Windows and Ubuntu candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const read = name => JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, name), 'utf8'))
          const run = read('run.json')
          assert.equal(run.repository.full_name, process.env.GITHUB_REPOSITORY)
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY)
          assert.equal(run.path, '.github/workflows/ci.yml')
          assert.equal(run.head_sha, process.env.EXPECTED_SOURCE_SHA)
          assert.equal(run.status, 'completed')
          assert.equal(run.conclusion, 'success')
          const jobs = read('jobs.json').jobs
          for (const name of ['build (ubuntu-latest)', 'build (windows-latest)']) {
            assert(jobs.some(job => job.name === name && job.conclusion === 'success'), 'Missing passed job: ' + name)
          }
          const candidates = read('artifacts.json').artifacts.filter(artifact => artifact.name === 'codex-reproduction-ubuntu-latest')
          assert.equal(candidates.length, 1)
          assert.equal(candidates[0].expired, false)
          assert.equal(candidates[0].workflow_run.head_sha, process.env.EXPECTED_SOURCE_SHA)
          console.log('VERIFIED_CANDIDATE', { sha: run.head_sha, run: run.id, attempt: run.run_attempt, artifact: candidates[0].id })
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - name: Fetch exact companion host baseline
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317
          path: .tmp/dsh-reference
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.TESTED_RUN }}
          github-token: ${{ github.token }}
          name: codex-reproduction-ubuntu-latest
          path: .tmp/verified-artifact
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Form minimal runtime and separate companion assets from tested source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs
          (cd .tmp/release-runtime && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          mkdir -p .tmp/release-installed
          tar -xzf "dist/dsh-codex-native-$RELEASE_VERSION.tgz" --strip-components=1 -C .tmp/release-installed
          git -C .tmp/dsh-reference apply --check "$GITHUB_WORKSPACE/dist/dsh-context-usage-0.2.1-rc.2.patch"
          git -C .tmp/dsh-reference apply "$GITHUB_WORKSPACE/dist/dsh-context-usage-0.2.1-rc.2.patch"
      - name: Verify final cleaned TGZ with the published companion patch
        env:
          DSH_RELEASE_ROOT: ${{ github.workspace }}/.tmp/release-installed
          DSH_REFERENCE_ROOT: ${{ github.workspace }}/.tmp/dsh-reference
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec vitest run --config vitest.release.config.ts --reporter=default --reporter=json --outputFile=.tmp/release-verification.json
      - name: Select the exact host build toolchain
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          package_json_file: .tmp/dsh-reference/package.json
      - name: Build the fixed official host with the shipped patch
        working-directory: .tmp/dsh-reference
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install final TGZ and start the patched source host
        env:
          DSH_HOME: ${{ runner.temp }}/paired-host-profile
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$DSH_HOME"
          (cd .tmp/dsh-reference && pnpm dsh plugin --profile web add "$GITHUB_WORKSPACE/dist/dsh-codex-native-$RELEASE_VERSION.tgz")
          (cd .tmp/dsh-reference && pnpm dsh --profile web --dump-config) > "$RUNNER_TEMP/paired-config.txt"
          grep -Fq codex-local "$RUNNER_TEMP/paired-config.txt"
          node scripts/verify-paired-host.mjs
          node scripts/prepare-release.mjs finalize
      - name: Publish immutable runtime-only tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag already exists; refusing overwrite'
            exit 1
          fi
          cd .tmp/release-runtime
          git init -q -b release-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "release: verified paired-host runtime $RELEASE_TAG from $EXPECTED_SOURCE_SHA"
          git tag "$RELEASE_TAG"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push -q origin "refs/tags/$RELEASE_TAG"
      - name: Verify exact GitHub installation and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/git-consumer"
          cd "$RUNNER_TEMP/git-consumer"
          printf '{"name":"temporary-consumer","private":true,"version":"1.0.0"}\n' > package.json
          printf 'packages:\n  - .\nautoInstallPeers: false\n' > pnpm-workspace.yaml
          pnpm add "github:$GITHUB_REPOSITORY#$RELEASE_TAG"
          P="$(realpath node_modules/dsh-codex-native)"
          for NAME in tests src scripts .github patches; do test ! -e "$P/$NAME"; done
          P="$P" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const pkg = JSON.parse(readFileSync(join(process.env.P, 'package.json'), 'utf8'))
          assert.equal(pkg.version, process.env.RELEASE_VERSION)
          assert(!pkg.scripts && !pkg.devDependencies)
          const manifest = JSON.parse(readFileSync(join(process.env.GITHUB_WORKSPACE, 'dist/release-manifest.json'), 'utf8'))
          for (const [path, hash] of Object.entries(manifest.runtimeSha256)) {
            assert.equal(createHash('sha256').update(readFileSync(join(process.env.P, path))).digest('hex'), hash)
          }
          console.log('EXACT_GITHUB_INSTALL_AND_RUNTIME_IDENTITY_PASSED')
          NODE
      - name: Publish paired-host GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '\nRelease verification: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> .tmp/release-notes.md
          gh release create "$RELEASE_TAG" \
            "dist/dsh-codex-native-$RELEASE_VERSION.tgz" \
            dist/dsh-context-usage-0.2.1-rc.2.patch \
            dist/INSTALL_PATCHED_HOST.md \
            dist/DSH-LICENSE.txt \
            dist/release-manifest.json \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title 'DSH Codex Native alpha.8 — context accounting (paired host preview)' \
            --notes-file .tmp/release-notes.md
      - name: Preserve release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha8-release-verification
          path: |
            dist/*
            .tmp/release-verification.json
            .tmp/paired-host-smoke.json
            .tmp/paired-host-startup.log
          if-no-files-found: ignore
