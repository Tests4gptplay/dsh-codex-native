name: Apply isolated Codex protocol repair
'on':
  push:
    branches: ['fix/protocol-stream-lifecycle']
    paths: ['.github/workflows/ci.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Tests4gptplay/dsh-codex-native' && github.ref == 'refs/heads/fix/protocol-stream-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact reviewed source patch and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/protocol-repair.py
          rm .github/protocol-repair.py
          git diff --check
          # Restore the workflow separately through the connector. This push
          # only needs repository content access, not workflow-write access.
          git restore .github/workflows/ci.yml
          git add src/wire.ts src/process-connection.ts src/runner.ts src/thread.ts src/session-cache.ts src/native-account.ts src/native-transport.ts tests/native-account.spec.ts tests/mock-stdio.spec.ts tests/fixtures/mock-app-server.mjs README.md README.zh.md package.json .github/protocol-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: settle closed Codex pipes and preserve process exit evidence'
          git push origin HEAD:refs/heads/fix/protocol-stream-lifecycle
          echo "REPAIRED_SOURCE_COMMIT=$(git rev-parse HEAD)"
