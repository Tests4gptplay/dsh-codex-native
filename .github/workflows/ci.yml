name: DSH Codex native build
'on':
  push:
    branches: [main, 'fix/protocol-stream-lifecycle']
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsh-codex-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact official DSH rendering source into disposable workspace
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317
          path: .tmp/dsh-reference
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install development dependencies only in CI
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Mock stdio, official DSH renderer, and account-free regression tests
        env:
          DSH_REFERENCE_ROOT: ${{ github.workspace }}/.tmp/dsh-reference
          DSH_REPRO_OUTPUT: ${{ runner.temp }}/codex-reproduction
        run: pnpm run test:ci
      - name: Build and pack
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          test -s lib/index.js
          test -s lib/client.js
          mkdir -p dist
          pnpm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-reproduction-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/codex-reproduction/*.html
            dist/*.tgz
          if-no-files-found: ignore
