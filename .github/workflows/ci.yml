name: DSH Codex native build
'on':
  push:
    branches: [main, 'fix/protocol-stream-lifecycle', 'audit/account-lifecycle-20261024']
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsh-codex-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch exact official DSH source into disposable workspace
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 687f282e8625c6b8d11ff58211a90524be2e4317
          path: .tmp/dsh-reference
          persist-credentials: false
      - name: Apply paired context-usage API patch to isolated host
        run: git -C .tmp/dsh-reference apply ../../patches/dsh-context-usage-0.2.1-rc.2.patch
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install development dependencies only in CI
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Mock stdio, official DSH renderer, and account-free regression tests
        env:
          DSH_REFERENCE_ROOT: ${{ github.workspace }}/.tmp/dsh-reference
          DSH_REPRO_OUTPUT: ${{ runner.temp }}/codex-reproduction
        run: pnpm run test:ci
      - name: Build and pack
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          test -s lib/index.js
          test -s lib/client.js
          mkdir -p dist
          pnpm pack --pack-destination dist
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          const digest = path => createHash('sha256').update(readFileSync(path)).digest('hex')
          const artifact = `dsh-codex-native-${pkg.version}.tgz`
          writeFileSync('dist/source-manifest.json', JSON.stringify({
            version: pkg.version,
            sourceCommit: git('rev-parse', 'HEAD'),
            sourceTree: git('rev-parse', 'HEAD^{tree}'),
            ciRun: process.env.GITHUB_RUN_ID,
            hostBase: git('-C', '.tmp/dsh-reference', 'rev-parse', 'HEAD'),
            hostPatchSha256: digest('patches/dsh-context-usage-0.2.1-rc.2.patch'),
            artifact,
            artifactSha256: digest(`dist/${artifact}`),
            runtimeSha256: Object.fromEntries(['lib/index.js', 'lib/client.js', 'cordis.patch.yml'].map(path => [path, digest(path)])),
          }, null, 2) + '\n')
          NODE
      - name: Assemble and inspect clean candidate TGZ
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          test "$VERSION" = '0.2.1-alpha.9'
          mkdir -p .tmp/clean-candidate .tmp/candidate-unpacked
          tar -xzf "dist/dsh-codex-native-$VERSION.tgz" --strip-components=1 -C .tmp/clean-candidate
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { copyFileSync, readFileSync, writeFileSync, readdirSync, statSync } from 'node:fs'
          import { join, relative } from 'node:path'
          const dir = '.tmp/clean-candidate'
          const manifest = JSON.parse(readFileSync(join(dir,'package.json'),'utf8'))
          for (const field of ['scripts','devDependencies','packageManager','publishConfig']) delete manifest[field]
          writeFileSync(join(dir,'package.json'),JSON.stringify(manifest,null,2)+'\n')
          for (const locale of ['README.md','README.zh.md']) copyFileSync(join('docs/releases/alpha.9',locale),join(dir,locale))
          const files = folder => readdirSync(folder).flatMap(name => {
            const p = join(folder,name)
            return statSync(p).isDirectory() ? files(p) : [relative(dir,p).replaceAll('\\','/')]
          })
          const items = files(dir)
          const allowed = new Set(['package.json','LICENSE','cordis.patch.yml','README.md','README.zh.md'])
          for (const p of items) assert(allowed.has(p)||/^lib\/(?:index\.js|client\.js|(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+\.d\.ts)$/.test(p),'Unexpected file: '+p)
          assert(!manifest.scripts && !manifest.devDependencies)
          assert.equal(manifest.version,'0.2.1-alpha.9')
          const client = readFileSync(join(dir,'lib/client.js'),'utf8')
          const old = ['不会自动刷新','非仅本插件','不是历史重置流水','不拆分当天用量','No automatic refresh','not only this plugin','not a historical reset ledger','no separate API key is needed']
          const docs = ['README.md','README.zh.md'].map(name=>readFileSync(join(dir,name),'utf8'))
          for (const snippet of old) for (const payload of [client,...docs]) assert(!payload.includes(snippet),'Old copy in installed package: '+snippet)
          for (const payload of docs) {
            assert(payload.includes('v0.2.1-alpha.9'))
            assert(payload.includes('https://raw.githubusercontent.com/Tests4gptplay/dsh-codex-native/main/docs/screenshots/codex-usage-desktop-anonymized.png'))
          }
          assert(client.includes('账号总用量') && client.includes('ChatGPT account total'),'Refined UI labels missing from compiled client')
          console.log('CLEAN_CANDIDATE_COPY_VERIFIED', {version:manifest.version,files:items.length})
          NODE
          rm "dist/dsh-codex-native-$VERSION.tgz"
          (cd .tmp/clean-candidate && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          tar -xzf "dist/dsh-codex-native-$VERSION.tgz" --strip-components=1 -C .tmp/candidate-unpacked
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync,writeFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const pkg = JSON.parse(readFileSync('.tmp/candidate-unpacked/package.json','utf8'))
          assert.equal(pkg.version,'0.2.1-alpha.9')
          assert(!pkg.scripts && !pkg.devDependencies)
          assert.equal(pkg.description,'Codex app-server main models for DSH with ChatGPT sign-in, Token history, context management and native tools.')
          for (const locale of ['README.md','README.zh.md']) {
            assert.equal(readFileSync('.tmp/candidate-unpacked/'+locale,'utf8'),
              readFileSync('docs/releases/alpha.9/'+locale,'utf8'),
              'Installed '+locale+' differs from the candidate copy')
          }
          const manifest = JSON.parse(readFileSync('dist/source-manifest.json','utf8'))
          const bundle = readFileSync('dist/dsh-codex-native-0.2.1-alpha.9.tgz')
          manifest.artifactSha256 = createHash('sha256').update(bundle).digest('hex')
          for (const [path,hash] of Object.entries(manifest.runtimeSha256)) {
            const data = readFileSync('.tmp/candidate-unpacked/'+path)
            assert.equal(createHash('sha256').update(data).digest('hex'),hash)
          }
          writeFileSync('dist/source-manifest.json',JSON.stringify(manifest,null,2)+'\n')
          writeFileSync('dist/candidate-copy-audit.json',JSON.stringify({
            version:pkg.version,
            package:manifest.artifact,
            packageSha256:manifest.artifactSha256,
            description:pkg.description,
            readmes:['README.md','README.zh.md'].map(name=>({
              name,
              sha256:createHash('sha256').update(readFileSync('.tmp/candidate-unpacked/'+name)).digest('hex'),
              byteMatchedToCandidate:true,
            })),
            curatedScreenshots:'three images in screenshots.json; anonymized user-approved Desktop screenshot first',
            runtimeSha256:manifest.runtimeSha256,
            sourceCommit:manifest.sourceCommit,
          },null,2)+'\n')
          console.log('CLEAN_TGZ_VERIFIED', {version:pkg.version,sha256:manifest.artifactSha256})
          NODE
      - name: Verify packed adapter against complete paired host modules
        shell: bash
        env:
          DSH_RELEASE_ROOT: ${{ github.workspace }}/.tmp/release-candidate
          DSH_REFERENCE_ROOT: ${{ github.workspace }}/.tmp/dsh-reference
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          mkdir -p .tmp/release-candidate
          tar -xzf "dist/dsh-codex-native-$VERSION.tgz" --strip-components=1 -C .tmp/release-candidate
          pnpm exec vitest run --config vitest.release.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-reproduction-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/codex-reproduction/*.html
            dist/*.tgz
            dist/source-manifest.json
            dist/candidate-copy-audit.json
          if-no-files-found: ignore
