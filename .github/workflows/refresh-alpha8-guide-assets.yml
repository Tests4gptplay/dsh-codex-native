name: Refresh alpha.8 release guide assets once
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-alpha8-guide-assets.yml']
permissions:
  contents: write
jobs:
  update-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Replace release guide and refresh SHA256 provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/alpha8-assets"
          mkdir -p "$DEST"
          gh release download v0.2.1-alpha.8 --repo "$GITHUB_REPOSITORY" --dir "$DEST"
          (cd "$DEST" && sha256sum --check SHA256SUMS)
          cp docs/INSTALL_PATCHED_HOST.md "$DEST/INSTALL_PATCHED_HOST.md"
          DEST="$DEST" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'
          const dest = process.env.DEST
          const sha = name => createHash('sha256').update(readFileSync(join(dest,name))).digest('hex')
          const size = name => readFileSync(join(dest,name)).length
          const manifestFile = join(dest, 'release-manifest.json')
          const manifest = JSON.parse(readFileSync(manifestFile,'utf8'))
          manifest.assets['INSTALL_PATCHED_HOST.md'] = { sha256: sha('INSTALL_PATCHED_HOST.md'), bytes: size('INSTALL_PATCHED_HOST.md') }
          writeFileSync(manifestFile, JSON.stringify(manifest,null,2)+'\n')
          const names = ['dsh-codex-native-0.2.1-alpha.8.tgz','dsh-context-usage-0.2.1-rc.2.patch','INSTALL_PATCHED_HOST.md','DSH-LICENSE.txt','release-manifest.json']
          writeFileSync(join(dest,'SHA256SUMS'), names.map(name=>sha(name)+'  '+name).join('\n')+'\n')
          NODE
          (cd "$DEST" && sha256sum --check SHA256SUMS)
          gh release upload v0.2.1-alpha.8 "$DEST/INSTALL_PATCHED_HOST.md" "$DEST/release-manifest.json" "$DEST/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
          echo 'RELEASE_GUIDE_ASSETS_REFRESHED'
