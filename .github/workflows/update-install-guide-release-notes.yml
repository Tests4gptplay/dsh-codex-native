name: Update published installation instructions
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/update-install-guide-release-notes.yml'
      - 'scripts/release-display-v0.2.3/NOTES.md'
permissions:
  contents: read
concurrency:
  group: dsh-codex-native-installation-notes-v0.2.3
  cancel-in-progress: false
jobs:
  update-notes:
    if: github.repository == 'Tests4gptplay/dsh-codex-native'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update only the existing release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/dsh-codex-native
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v0.2.3" > "$RUNNER_TEMP/release-before.json"
          jq -e '.tag_name == "v0.2.3" and .draft == false and .prerelease == false' "$RUNNER_TEMP/release-before.json"
          jq -r .body "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/body-before.md"
          test "$(sha256sum "$RUNNER_TEMP/body-before.md" | cut -d' ' -f1)" = 'e93e09263671867e6a59b3b7e2111a1a2deec56e08666e933b7218e560a86393'
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/assets-before.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.2.3" > "$RUNNER_TEMP/tag-before.json"
          test "$(jq -r .object.sha "$RUNNER_TEMP/tag-before.json")" = '6e769b236f17527b0ef4e4120568fab4140b9bb5'
          gh release edit v0.2.3 --notes-file scripts/release-display-v0.2.3/NOTES.md
          gh api "repos/$GH_REPO/releases/tags/v0.2.3" > "$RUNNER_TEMP/release-after.json"
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/assets-after.json"
          cmp "$RUNNER_TEMP/assets-before.json" "$RUNNER_TEMP/assets-after.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.2.3" > "$RUNNER_TEMP/tag-after.json"
          cmp "$RUNNER_TEMP/tag-before.json" "$RUNNER_TEMP/tag-after.json"
          jq -r .body "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/body-after.md"
          diff -u <(sed -e '${/^$/d;}' scripts/release-display-v0.2.3/NOTES.md) <(sed -e '${/^$/d;}' "$RUNNER_TEMP/body-after.md")
