name: Refresh alpha.9 release guide and checksums once
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/repair-alpha9-guide-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  repair:
    if: github.repository == 'Tests4gptplay/dsh-codex-native'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Refresh versioned guide, release manifest and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/release-assets
          gh release download v0.2.1-alpha.9 --repo "$GITHUB_REPOSITORY" --dir .tmp/release-assets
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {createHash} from 'node:crypto'
          import {readFileSync,writeFileSync,copyFileSync} from 'node:fs'
          const root='.tmp/release-assets/'
          const file=name=>root+name
          const digest=name=>createHash('sha256').update(readFileSync(file(name))).digest('hex')
          const manifest=JSON.parse(readFileSync(file('release-manifest.json'),'utf8'))
          assert.equal(manifest.version,'0.2.1-alpha.9')
          assert.equal(manifest.sourceCommit,'ce85bb24750915cb9623a2e60967538058f17e5b')
          assert.equal(digest('dsh-codex-native-0.2.1-alpha.9.tgz'),'2ec0360587e55350aed1c897d632014680eec00a71f8f612230c742832201395')
          assert.equal(digest('dsh-context-usage-0.2.1-rc.2.patch'),'dd8049f33fea9187cc025e792fc25feb68a8ad5ccb1044cc85e063429c2b717e')
          const targets=Object.keys(manifest.assets)
          assert.equal(targets.length,4)
          for(const name of targets)assert.equal(digest(name),manifest.assets[name].sha256,'Existing asset mismatch: '+name)
          const guide=readFileSync('docs/releases/alpha.9/INSTALL_PATCHED_HOST.md','utf8')
          assert(guide.includes('v0.2.1-alpha.9') && !guide.includes('v0.2.1-alpha.8'))
          copyFileSync('docs/releases/alpha.9/INSTALL_PATCHED_HOST.md',file('INSTALL_PATCHED_HOST.md'))
          manifest.assets['INSTALL_PATCHED_HOST.md']={sha256:digest('INSTALL_PATCHED_HOST.md'),bytes:readFileSync(file('INSTALL_PATCHED_HOST.md')).length}
          writeFileSync(file('release-manifest.json'),JSON.stringify(manifest,null,2)+'\n')
          const names=[...Object.keys(manifest.assets),'release-manifest.json']
          writeFileSync(file('SHA256SUMS'),names.map(name=>digest(name)+'  '+name).join('\n')+'\n')
          const sums=readFileSync(file('SHA256SUMS'),'utf8').trim().split('\n')
          for(const row of sums){const parts=/^([a-f0-9]{64})  (.+)$/.exec(row);assert(parts);assert.equal(parts[1],digest(parts[2]))}
          console.log('ALPHA9_GUIDE_CHECKSUMS_READY',{guideSHA256:digest('INSTALL_PATCHED_HOST.md'),manifestSHA256:digest('release-manifest.json'),sumsSHA256:digest('SHA256SUMS')})
          NODE
          gh release upload v0.2.1-alpha.9 --repo "$GITHUB_REPOSITORY" \
            .tmp/release-assets/INSTALL_PATCHED_HOST.md \
            .tmp/release-assets/release-manifest.json \
            .tmp/release-assets/SHA256SUMS --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.1-alpha.9" > .tmp/release-metadata.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          import {createHash} from 'node:crypto'
          const files=['INSTALL_PATCHED_HOST.md','release-manifest.json','SHA256SUMS']
          const assets=JSON.parse(readFileSync('.tmp/release-metadata.json','utf8')).assets
          const hash=n=>'sha256:'+createHash('sha256').update(readFileSync('.tmp/release-assets/'+n)).digest('hex')
          for(const name of files){const asset=assets.find(a=>a.name===name);assert(asset);assert.equal(asset.digest,hash(name),'Release digest mismatch: '+name)}
          assert.equal(assets.find(a=>a.name==='dsh-codex-native-0.2.1-alpha.9.tgz').digest,'sha256:2ec0360587e55350aed1c897d632014680eec00a71f8f612230c742832201395')
          console.log('ALPHA9_RELEASE_ASSETS_VERIFIED',{assets:assets.length})
          NODE
